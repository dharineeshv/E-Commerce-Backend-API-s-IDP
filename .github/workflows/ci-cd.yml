name: CloudBasket Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - customer-service-frontend-implementation
  pull_request:
    branches:
      - main
      - master
      - customer-service-frontend-implementation

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: Run Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Microservice Dependencies
        run: |
          npm --prefix CloudBasket-Frontend install --no-audit --no-fund || true
          npm --prefix product-service install --no-audit --no-fund || true
          npm --prefix order-service install --no-audit --no-fund || true
          npm --prefix inventory-service install --no-audit --no-fund || true
          npm --prefix cart-service install --no-audit --no-fund || true
          npm --prefix payment-service install --no-audit --no-fund || true
          npm --prefix user-profile-service install --no-audit --no-fund || true
          npm --prefix marketing-service install --no-audit --no-fund || true

      - name: Execute All Service Unit Test Suites
        run: |
          node --test CloudBasket-Frontend/test/frontendUtils.test.js
          node --test product-service/test/productService.test.js
          node --test order-service/test/orderService.test.js
          node --test inventory-service/test/inventoryService.test.js
          node --test cart-service/test/cartService.test.js
          node --test payment-service/test/paymentService.test.js
          node --test user-profile-service/test/userProfileService.test.js
          node --test marketing-service/test/marketingService.test.js

  security-scan:
    name: Snyk Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Snyk Security Scan for Dependencies
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  sonarqube-scan:
    name: SonarQube Cloud Quality & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to AWS S3 & CloudFront
    needs: [test, security-scan, sonarqube-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/customer-service-frontend-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Sync Frontend to Primary S3 Bucket (cloudbasket-frontend)
        run: |
          aws s3 sync ./CloudBasket-Frontend s3://cloudbasket-frontend --delete

      - name: Sync Frontend to Secondary S3 Bucket (dharineesh-frontend)
        run: |
          aws s3 sync ./CloudBasket-Frontend s3://dharineesh-frontend --delete

      - name: Invalidate Primary CloudFront Distribution (E3SHU2W3OPM84E)
        run: |
          aws cloudfront create-invalidation --distribution-id E3SHU2W3OPM84E --paths "/*"

      - name: Invalidate Secondary CloudFront Distribution (E3NI79AATXTTJN)
        run: |
          aws cloudfront create-invalidation --distribution-id E3NI79AATXTTJN --paths "/*"

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Zip Utility & Deploy Backend Microservices to AWS Lambda
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          for svc in authentication-service cart-service inventory-service marketing-service notification-service order-service payment-service product-service review-service user-profile-service wishlist-service; do
            if [ -d "$svc" ]; then
              echo "Installing production deps for $svc..."
              npm --prefix "$svc" install --omit=dev --no-audit --no-fund || true
            fi
          done
          node upload_lambdas.mjs
