name: CloudBasket Frontend & Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - customer-service-frontend-implementation
  pull_request:
    branches:
      - main
      - master
      - customer-service-frontend-implementation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-test-deploy:
    name: Build, Test & Deploy CloudBasket Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Service Dependencies & Execute Unit Test Suites
        run: |
          (cd backend/product-service && npm install --no-audit --no-fund)
          node --test CloudBasket-Frontend/test/frontendUtils.test.js
          (cd backend/product-service && node --test test/productService.test.js)

      - name: Snyk Security Scan (Non-blocking)
        continue-on-error: true
        run: |
          npx --yes snyk test || echo "Snyk security scan complete"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: SonarQube Cloud Analysis (Non-blocking)
        continue-on-error: true
        run: |
          npx --yes sonarqube-scanner \
            -Dsonar.organization=dharineeshv \
            -Dsonar.projectKey=dharineeshv_E-Commerce-Backend-API-s-IDP \
            -Dsonar.host.url=https://sonarcloud.io || echo "SonarQube scan complete"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Deploy Frontend to AWS S3 Buckets
        run: |
          aws s3 sync ./CloudBasket-Frontend s3://cloudbasket-frontend --delete
          aws s3 sync ./CloudBasket-Frontend s3://dharineesh-frontend --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3SHU2W3OPM84E --paths "/*"
          aws cloudfront create-invalidation --distribution-id E3NI79AATXTTJN --paths "/*"

      - name: Package & Deploy Microservices to AWS Lambda
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          for svc in authentication-service cart-service inventory-service marketing-service notification-service order-service payment-service product-service review-service user-profile-service wishlist-service; do
            if [ -d "backend/$svc" ]; then
              echo "Installing production deps for $svc..."
              (cd "backend/$svc" && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
            fi
          done
          node upload_lambdas.mjs
