name: CloudBasket Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Frontend Unit Tests
        run: node --test CloudBasket-Frontend/test/*.test.js

  deploy:
    name: Deploy to AWS S3 & CloudFront
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync Frontend to Primary S3 Bucket (cloudbasket-frontend)
        run: |
          aws s3 sync ./CloudBasket-Frontend s3://cloudbasket-frontend --delete

      - name: Sync Frontend to Secondary S3 Bucket (dharineesh-frontend)
        run: |
          aws s3 sync ./CloudBasket-Frontend s3://dharineesh-frontend --delete

      - name: Invalidate Primary CloudFront Distribution (E3SHU2W3OPM84E)
        run: |
          aws cloudfront create-invalidation --distribution-id E3SHU2W3OPM84E --paths "/*"

      - name: Invalidate Secondary CloudFront Distribution (E3NI79AATXTTJN)
        run: |
          aws cloudfront create-invalidation --distribution-id E3NI79AATXTTJN --paths "/*"
