# =====================================================================
# SonarQube / SonarCloud Configuration for CloudBasket Platform
# =====================================================================

sonar.projectKey=CloudBasket-ECommerce-Platform
sonar.projectName=CloudBasket E-Commerce Platform
sonar.projectVersion=1.0.0

# Source Directories to Analyze
sonar.sources=CloudBasket-Frontend,authentication-service,cart-service,inventory-service,marketing-service,notification-service,order-service,payment-service,product-service,review-service,user-profile-service,wishlist-service

# File Exclusions
sonar.exclusions=**/node_modules/**,**/lambda-zips/**,**/*.test.js,**/coverage/**,**/scratch/**,**/*.png,**/*.jpg,**/*.jpeg

# Language & Encoding
sonar.sourceEncoding=UTF-8
