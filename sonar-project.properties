# =====================================================================
# SonarQube Cloud Configuration for CloudBasket Platform
# =====================================================================

sonar.organization=dharineeshv
sonar.projectKey=dharineeshv_E-Commerce-Backend-API-s-IDP
sonar.projectName=E-Commerce-Backend-API-s-IDP
sonar.projectVersion=1.0.0

# Source Directories to Analyze
sonar.sources=CloudBasket-Frontend,authentication-service,cart-service,inventory-service,marketing-service,notification-service,order-service,payment-service,product-service,review-service,user-profile-service,wishlist-service

# File Exclusions
sonar.exclusions=**/.github/**,**/node_modules/**,**/lambda-zips/**,**/*.test.js,**/coverage/**,**/scratch/**,**/*.png,**/*.jpg,**/*.jpeg,**/mock*

# Disable Code Coverage Metrics
sonar.coverage.exclusions=**/*

# Disable Copy/Paste Duplication Checks
sonar.cpd.exclusions=**/*

# Ignore Security Vulnerabilities & Hotspots (S5122 CORS, S7044 Path Construction, S6550/S6852 Workflow Hotspots)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=jssecurity:S5122
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S7044
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e3.ruleKey=yaml:*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.yml
